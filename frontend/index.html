<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <!-- ?v=2: browsers cache icons hard; bump it when the logo changes so everyone gets the new one. -->
    <!-- Icon used when someone adds the site to an iPhone/iPad home screen. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spendr</title>
    <meta name="description" content="Spendr: a budget tracker for students. No bank login, just upload your statement." />
    <meta name="theme-color" content="#0f7a4f" />
    <!-- Apply dark mode before the first paint (same rules as src/theme.ts) to avoid a white flash. -->
    <script>
      try {
        var t = localStorage.getItem('theme')
        if (t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark')
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
