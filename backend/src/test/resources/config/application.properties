# Test-only settings, layered on top of src/main/resources/application.properties.
#
# Most tests log in with MockMvc's in-memory session (MockHttpSession), which Spring Session would
# bypass, so Spring Session is turned off here. SessionPersistenceIntegrationTest turns it back on
# to test the real Postgres-backed sessions used in production.
spring.autoconfigure.exclude=\
  org.springframework.boot.session.autoconfigure.SessionAutoConfiguration,\
  org.springframework.boot.session.jdbc.autoconfigure.JdbcSessionAutoConfiguration

# Every MockMvc request comes from 127.0.0.1, so failed logins from all tests would add up on one
# IP. LoginRateLimiterTest covers the per-IP limit directly.
app.login-limit.per-ip=100000
