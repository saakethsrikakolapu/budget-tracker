# Production settings, used when SPRING_PROFILES_ACTIVE=prod (set on Render).
# Everything secret comes from environment variables set in the hosting dashboard, never from git.

# Database (Neon). DATABASE_URL looks like jdbc:postgresql://<host>/<db>?sslmode=require
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
# The free database allows few connections, and this app is small.
spring.datasource.hikari.maximum-pool-size=5

# The app sits behind HTTPS proxies (Vercel, Render). Trust their X-Forwarded-* headers so Spring
# knows the original request was HTTPS, and only send cookies over HTTPS.
server.forward-headers-strategy=framework
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Fit in the free tier's 512 MB: fewer request threads than the default 200.
server.tomcat.threads.max=20
