# Production settings, used when SPRING_PROFILES_ACTIVE=prod (set on Render).
# Everything secret comes from environment variables set in the hosting dashboard, never from git.

# Database (Neon). DATABASE_URL looks like jdbc:postgresql://<host>/<db>?sslmode=require
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
# The free database allows few connections, and this app is small.
spring.datasource.hikari.maximum-pool-size=5

# The app sits behind HTTPS proxies (Vercel, Render). Trust their X-Forwarded-* headers so Spring
# knows the original request was HTTPS, and only send cookies over HTTPS.
server.forward-headers-strategy=framework
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Fit in the free tier's 512 MB: fewer request threads than the default 200.
server.tomcat.threads.max=20

# Email (password reset, email verification). Set these on Render to turn sending on:
#   SPRING_MAIL_HOST, SPRING_MAIL_PORT (587), SPRING_MAIL_USERNAME, SPRING_MAIL_PASSWORD, MAIL_FROM
# Without SPRING_MAIL_HOST nothing is sent, and email bodies are never written to the logs here
# (a reset link in a log would let anyone with log access take over the account).
app.mail.log-body=false
app.mail.from=${MAIL_FROM:Budget Tracker <no-reply@budget-tracker.app>}
# Where the links in emails point (the frontend).
app.base-url=${APP_BASE_URL:https://budget-tracker-saaketh1.vercel.app}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Don't let a slow mail server hold a request for long.
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
