spring.application.name=budget

# Hosting platforms like Render tell the app which port to listen on via $PORT.
server.port=${PORT:8080}

# Load DB_* values from the repo's .env file in local dev (works whether the app starts
# from the repo root or from backend/). In production, real environment variables are used.
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# Database connection
spring.datasource.url=jdbc:postgresql://localhost:5432/${DB_NAME:budget}
spring.datasource.username=${DB_USERNAME:budget}
spring.datasource.password=${DB_PASSWORD:}
# Give up waiting for a DB connection after 5s (default 30s) so requests, including
# /api/health, fail fast when the database is down.
spring.datasource.hikari.connection-timeout=5000

# Statement uploads: reject large files before they're fully read into memory.
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB

# Login sessions live in Postgres (tables created by Flyway V4), so restarts don't log everyone out.
spring.session.jdbc.initialize-schema=never

# Flyway owns the schema; Hibernate only checks that entities match it.
spring.jpa.hibernate.ddl-auto=validate
# Don't hold database connections open while rendering responses.
spring.jpa.open-in-view=false
